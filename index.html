<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="calc">
            <div class="result">
                <input type="number" value="0">
            </div>
            <div class="tombol"><button class="btn">MR</button></div>
            <div><button class="btn">+M</button></div>
            <div><button class="btn">-M</button></div>
            <div><button class="btn">DEL</button></div>
            <div><button class="btn help">AC</button></div>
            <div><button class="btn help">CE</button></div>
            <div><button class="btn help">%</button></div>
            <div><button class="operator">/</button></div>
            <div><button>7</button></div>
            <div><button>8</button></div>
            <div><button>9</button></div>
            <div><button class="operator">x</button></div>
            <div><button>4</button></div>
            <div><button>5</button></div>
            <div><button>6</button></div>
            <div><button class="operator">-</button></div>
            <div><button>1</button></div>
            <div><button>2</button></div>
            <div><button>3</button></div>
            <div><button class="operator">+</button></div>
            <div><button>+/-</button></div>
            <div><button>0</button></div>
            <div><button>.</button></div>
            <div><button class="operator equal">=</button></div>
        </div>
    </div>
</body>
</html>
